<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg, #06142a);
        overflow: hidden;
      }
      body {
        background: radial-gradient(120% 80% at 50% -10%, #0d2240 0%, #06142a 45%, #020a16 100%);
      }
      body.day {
        background: #f7f7f5;
      }
      body.signal {
        background: #fdb515;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      [data-anchor] {
        position: fixed;
        outline: 1px dashed rgba(255, 0, 0, 0);
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div data-anchor="hero" style="left: 52%; top: 24%; width: 20vh; height: 30vh"></div>
    <div data-anchor="thesis" style="left: 58%; top: -30%; width: 80vh; height: 130vh"></div>
    <div data-anchor="mark" style="left:50%;top:30%;width:1px;height:30vh"></div>
<div data-anchor="chain" style="left: 45%; top: 44%; width: 9vh; height: 12vh"></div>
    <div data-anchor="day" style="left: 55%; top: 30%; width: 30vh; height: 36vh"></div>
    <div data-anchor="close" style="left: 45%; top: 30%; width: 30vh; height: 30vh"></div>
    <script type="module" src="/src/lab.ts"></script>
  </body>
</html>
